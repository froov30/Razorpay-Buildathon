<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="1160" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6577"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <style>
      .lane   { fill:#f7f8fa; stroke:#dfe3ea; stroke-width:1; rx:10; }
      .lane-t { font-size:12px; font-weight:700; fill:#7c8598; letter-spacing:.08em; }
      .box    { fill:#ffffff; stroke:#c8cfdb; stroke-width:1.4; rx:8; }
      .box-hi { fill:#fff4f4; stroke:#c0392b; stroke-width:2; rx:8; }
      .box-au { fill:#f1f8f2; stroke:#2e7d32; stroke-width:1.6; rx:8; }
      .box-ca { fill:#f0f3ff; stroke:#3949ab; stroke-width:1.6; rx:8; }
      .box-in { fill:#fcfaf3; stroke:#b8912f; stroke-width:1.4; rx:8; }
      .t      { font-size:13.5px; font-weight:650; fill:#1e2430; }
      .s      { font-size:11px; fill:#6b7488; font-style:italic; }
      .lbl    { font-size:10.5px; fill:#5b6577; }
      .lbl-r  { font-size:10.5px; fill:#c0392b; font-weight:600; }
      .flow   { stroke:#5b6577; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
      .flow-r { stroke:#c0392b; stroke-width:1.5; fill:none; marker-end:url(#arrowRed); stroke-dasharray:5 3; }
      .flow-d { stroke:#8a93a5; stroke-width:1.3; fill:none; marker-end:url(#arrow); stroke-dasharray:5 3; }
      .title  { font-size:19px; font-weight:700; fill:#12161f; }
      .sub    { font-size:12.5px; fill:#5b6577; }
    </style>
  </defs>

  <rect width="1160" height="760" fill="#ffffff"/>

  <text x="34" y="34" class="title">EntitleGraph Close Agent — architecture</text>
  <text x="34" y="56" class="sub">Razorpay Recon proves the money that moved matches the settlement records.</text>
  <text x="34" y="74" class="sub" font-weight="700" fill="#12161f">EntitleGraph proves the money that moved matches what the contract actually promised.</text>

  <!-- ============ INPUTS ============ -->
  <rect class="lane" x="30" y="100" width="240" height="228"/>
  <text x="46" y="122" class="lane-t">INPUTS — ALL SYNTHETIC</text>

  <rect class="box-in" x="46" y="136" width="208" height="58"/>
  <text x="150" y="160" class="t" text-anchor="middle">Merchant agreements</text>
  <text x="150" y="178" class="s" text-anchor="middle">prose, versioned, amendable</text>

  <rect class="box-in" x="46" y="214" width="208" height="98"/>
  <text x="150" y="238" class="t" text-anchor="middle">Order lifecycle</text>
  <text x="150" y="257" class="s" text-anchor="middle">orders · payments</text>
  <text x="150" y="273" class="s" text-anchor="middle">deliveries · promotions</text>
  <text x="150" y="289" class="s" text-anchor="middle">transfers · refunds</text>

  <!-- ============ WHAT WAS PROMISED ============ -->
  <rect class="lane" x="300" y="100" width="270" height="212"/>
  <text x="316" y="122" class="lane-t">WHAT WAS PROMISED</text>

  <rect class="box" x="316" y="136" width="238" height="52"/>
  <text x="435" y="157" class="t" text-anchor="middle">Contract Compiler</text>
  <text x="435" y="175" class="s" text-anchor="middle">LLM or deterministic · may refuse</text>

  <rect class="box-ca" x="316" y="196" width="238" height="46"/>
  <text x="435" y="215" class="t" text-anchor="middle">Compile cache</text>
  <text x="435" y="232" class="s" text-anchor="middle">canonical JSON · content-addressed</text>

  <rect class="box" x="316" y="250" width="238" height="48"/>
  <text x="435" y="270" class="t" text-anchor="middle">Version Resolver</text>
  <text x="435" y="288" class="s" text-anchor="middle">supersession · readings as worlds</text>

  <!-- ============ WHAT HAPPENED ============ -->
  <rect class="lane" x="300" y="326" width="270" height="86"/>
  <text x="316" y="348" class="lane-t">WHAT HAPPENED</text>
  <rect class="box" x="316" y="356" width="238" height="44"/>
  <text x="435" y="375" class="t" text-anchor="middle">Entitlement Graph</text>
  <text x="435" y="392" class="s" text-anchor="middle">event-sourced order view</text>

  <!-- ============ COMPARISON ============ -->
  <rect class="lane" x="600" y="100" width="270" height="312"/>
  <text x="616" y="122" class="lane-t">COMPARISON</text>

  <rect class="box" x="616" y="150" width="238" height="56"/>
  <text x="735" y="172" class="t" text-anchor="middle">Settlement Computation</text>
  <text x="735" y="190" class="s" text-anchor="middle">pure function · integer paise</text>

  <rect class="box" x="616" y="238" width="238" height="56"/>
  <text x="735" y="260" class="t" text-anchor="middle">Matcher</text>
  <text x="735" y="278" class="s" text-anchor="middle">root cause + confidence tier</text>

  <rect class="box" x="616" y="326" width="238" height="56"/>
  <text x="735" y="348" class="t" text-anchor="middle">Exception Investigator</text>
  <text x="735" y="366" class="s" text-anchor="middle">playbook · owner · action</text>

  <!-- ============ CONTROL PLANE ============ -->
  <rect class="lane" x="900" y="100" width="230" height="312"/>
  <text x="916" y="122" class="lane-t">CONTROL PLANE</text>

  <rect class="box-hi" x="916" y="150" width="198" height="62"/>
  <text x="1015" y="173" class="t" text-anchor="middle" fill="#c0392b">Entitlement Gate</text>
  <text x="1015" y="191" class="s" text-anchor="middle" fill="#a5432f">maker–checker · single-use token</text>

  <rect class="box" x="916" y="240" width="198" height="56"/>
  <text x="1015" y="262" class="t" text-anchor="middle">Razorpay Route client</text>
  <text x="1015" y="280" class="s" text-anchor="middle">LIVE-TEST | MOCK</text>

  <rect class="box-au" x="916" y="324" width="198" height="58"/>
  <text x="1015" y="347" class="t" text-anchor="middle" fill="#2e7d32">Audit log</text>
  <text x="1015" y="365" class="s" text-anchor="middle" fill="#3f6b42">hash-chained · append-only</text>

  <!-- ============ SURFACES ============ -->
  <rect class="lane" x="300" y="600" width="830" height="118"/>
  <text x="316" y="622" class="lane-t">SURFACES</text>

  <rect class="box" x="330" y="636" width="240" height="58"/>
  <text x="450" y="659" class="t" text-anchor="middle">Streamlit dashboard</text>
  <text x="450" y="677" class="s" text-anchor="middle">prevented loss · blocked payouts</text>

  <rect class="box" x="600" y="636" width="240" height="58"/>
  <text x="720" y="659" class="t" text-anchor="middle">FastAPI</text>
  <text x="720" y="677" class="s" text-anchor="middle">orders · exceptions · metrics</text>

  <rect class="box" x="870" y="636" width="240" height="58"/>
  <text x="990" y="659" class="t" text-anchor="middle">Evaluation harness</text>
  <text x="990" y="677" class="s" text-anchor="middle">7 metrics vs ground truth</text>

  <!-- ============ FLOWS ============ -->
  <!-- inputs -> lanes -->
  <path class="flow" d="M 254 165 L 310 165"/>
  <path class="flow" d="M 254 263 C 280 263, 284 378, 310 378"/>

  <!-- compiler chain -->
  <path class="flow" d="M 435 188 L 435 194"/>
  <path class="flow" d="M 435 242 L 435 248"/>

  <!-- resolver + graph -> computation -->
  <path class="flow" d="M 554 274 C 580 274, 588 178, 610 178"/>
  <text x="566" y="222" class="lbl">governing policy</text>
  <text x="566" y="236" class="lbl">or refusal</text>
  <path class="flow" d="M 554 378 C 582 378, 590 196, 610 196"/>

  <!-- computation -> matcher -> investigator -->
  <path class="flow" d="M 735 206 L 735 232"/>
  <path class="flow" d="M 735 294 L 735 320"/>

  <!-- proposed transfer -> gate -->
  <path class="flow" d="M 554 366 C 700 430, 880 240, 910 190"/>
  <text x="700" y="424" class="lbl">proposed transfer</text>

  <!-- matcher -> gate -->
  <path class="flow" d="M 854 258 C 880 258, 894 206, 912 194"/>

  <!-- gate -> client -->
  <path class="flow" d="M 1015 212 L 1015 234"/>
  <text x="1024" y="228" class="lbl">token</text>

  <!-- refusals + executions -> audit -->
  <path class="flow-r" d="M 930 212 C 916 250, 916 290, 930 320"/>
  <text x="836" y="300" class="lbl-r">refusal + reason</text>
  <path class="flow-d" d="M 1015 296 L 1015 320"/>

  <!-- to surfaces -->
  <path class="flow-d" d="M 700 382 C 640 470, 470 560, 452 630"/>
  <path class="flow-d" d="M 760 382 L 740 630"/>
  <path class="flow-d" d="M 800 300 C 940 480, 984 540, 990 630"/>
  <path class="flow-d" d="M 1015 382 C 1015 470, 560 540, 470 630"/>

  <!-- ============ KEY CLAIM ============ -->
  <rect x="30" y="440" width="540" height="140" rx="10" fill="#fff8f8" stroke="#e6c3c0"/>
  <text x="50" y="466" class="lane-t" fill="#c0392b">THE LOAD-BEARING GUARANTEE</text>
  <text x="50" y="492" class="t">No money moves without passing the gate.</text>
  <text x="50" y="514" class="s" font-style="normal" fill="#4a5261">The Route client refuses any transfer lacking a single-use,</text>
  <text x="50" y="532" class="s" font-style="normal" fill="#4a5261">content-bound, HMAC-signed approval token — so bypass, replay,</text>
  <text x="50" y="550" class="s" font-style="normal" fill="#4a5261">and post-approval mutation all fail closed. Six attack classes are</text>
  <text x="50" y="568" class="s" font-style="normal" fill="#4a5261">run against it on every test run; unsafe-action count is 0.</text>

  <text x="600" y="470" class="lbl" fill="#7c8598">Solid arrows: data flow.  Dashed: audit and presentation.</text>
  <text x="600" y="488" class="lbl" fill="#7c8598">Red: the control path that can refuse.</text>
  <text x="600" y="516" class="lbl" fill="#7c8598">Reference implementation · synthetic data · Razorpay test mode only.</text>
</svg>
